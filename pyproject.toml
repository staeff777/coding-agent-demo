[project]
name = "coding-agent-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hurry-filesize>=0.9",
    "openai>=1.109.0",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.10.1",
    "ruff>=0.13.2",
    "tree-sitter>=0.25.1",
    "tree-sitter-bash>=0.25.0",
    "tree-sitter-python>=0.25.0",
]

[project.scripts]
coding-agent = "coding_agent_demo.main:run"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]


